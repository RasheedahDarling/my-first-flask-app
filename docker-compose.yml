services:
  flask:
    build: .
    container_name: my-flask-container
    ports:
      - "5000:5000"
    depends_on:
      - mysql

  mysql:
    image: mysql:8.0
    container_name: my-mysql
    environment:
      MYSQL_ROOT_PASSWORD: mypassword
      MYSQL_DATABASE: myappdb
    ports:
      - "3306:3306"